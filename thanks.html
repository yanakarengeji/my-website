<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送信完了 | 蓮華寺/谷中浄苑</title>
    <link rel="stylesheet" href="styles.css?v=10">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .thanks-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            margin-top: 80px; /* Header offset */
        }
        .thanks-box {
            max-width: 600px;
            background: #fff;
            padding: 4rem 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border-top: 4px solid var(--color-dark-green);
        }
        .thanks-icon {
            font-size: 4rem;
            color: var(--color-dark-green);
            margin-bottom: 2rem;
        }
        .thanks-title {
            font-family: var(--font-serif);
            font-size: 2rem;
            color: var(--color-dark-green);
            margin-bottom: 1.5rem;
            font-weight: 500;
        }
        .thanks-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--color-text-main);
            margin-bottom: 3rem;
        }
        .btn-back {
            display: inline-block;
            background-color: var(--color-dark-green);
            color: #fff !important;
            padding: 1rem 2.5rem;
            border-radius: 4px;
            font-weight: 500;
            transition: opacity 0.3s;
        }
        .btn-back:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner container">
            <a href="index.html" class="logo">
                <span class="logo-kanji">蓮華寺/谷中浄苑</span>
            </a>
        </div>
    </header>

    <main>
        <section class="thanks-container">
            <div class="thanks-box">
                <div class="thanks-icon">✉</div>
                <h1 class="thanks-title">送信が完了いたしました</h1>
                <p class="thanks-text">
                    お問い合わせ・ご相談いただき、誠にありがとうございます。<br>
                    ご入力いただいた内容は無事に送信されました。<br><br>
                    折り返し担当者よりご連絡いたしますので、<br>
                    今しばらくお待ちください。
                </p>
                <a href="index.html" class="btn-back">トップページへ戻る</a>
            </div>
        </section>
    </main>

    <footer class="footer" style="padding: 2rem 0; text-align: center; font-size: 0.9rem; border-top: 1px solid #eaeaea;">
        <div class="container">
            &copy; 2026 蓮華寺/谷中浄苑 All rights reserved.
        </div>
    </footer>
</body>
</html>
